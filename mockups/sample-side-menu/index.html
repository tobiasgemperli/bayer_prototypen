<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResiYou — Plots (mockup)</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    /* Plots page: a static screenshot. The only interactive part is the
       hamburger hotspot, which opens the shared Navigate drawer. */
    body { background: #e9eaee; display: flex; justify-content: center; }
    .frame { position: relative; width: 100%; max-width: 1260px; }
    .screenshot { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }

    /* Transparent clickable area over the hamburger icon in the screenshot. */
    .hotspot {
      position: absolute; left: 0.6%; top: 1.2%; width: 3.2%; height: 4.6%;
      border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 8px;
      transition: background .15s;
    }
    .hotspot:hover { background: rgba(0,0,0,0.06); }
    .hotspot:focus-visible { outline: 2px solid #d4183d; outline-offset: 2px; }

    /* Overlay covers the whole app (screenshot has no browser chrome). */
    .overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  </style>
</head>
<body>
  <div class="frame" id="frame">
    <img class="screenshot" src="plots.png" alt="ResiYou plots page" />

    <button class="hotspot" id="menuBtn" aria-label="Open navigation menu"></button>

    <div class="overlay">
      <div class="scrim" id="scrim"></div>
      <nav class="drawer" role="navigation" aria-label="Navigate">
        <div class="overline">Navigate</div>
        <ul class="nav">
          <li><a class="item selected" data-current href="index.html">

            Plots</a></li>
          <li><a class="item" href="samples.html">
            <svg viewBox="0 0 24 24"><path d="M13 11.33 18 18H6l5-6.67V6h2m2.96-2H8.04c-.42 0-.65.48-.39.81L9 6.5v4.17L3.2 18.4c-.49.66-.02 1.6.8 1.6h16c.82 0 1.29-.94.8-1.6L15 10.67V6.5l1.35-1.69c.26-.33.03-.81-.39-.81"/></svg>
            Samples</a></li>
          <li><a class="item" data-noop href="#">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2m0 16H5v-3h3.56c.69 1.19 1.97 2 3.45 2s2.75-.81 3.45-2H19zm0-5h-4.99c0 1.1-.9 2-2 2s-2-.9-2-2H5V5h14z"/></svg>
            Inbox</a></li>
        </ul>
      </nav>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
