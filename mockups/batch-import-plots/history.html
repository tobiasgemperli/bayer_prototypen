<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResiYou — History (mockup)</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    body { background: #e9eaee; }
    .frame { position: relative; min-height: 100vh; max-width: 1260px; margin: 0 auto; background: #f5f5f7; }

    /* Top app bar — same as the other mockup pages. */
    .appbar { height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 24px; background: #fff; border-bottom: 1px solid #DCDBDB; position: relative; z-index: 1; }
    .menu-btn { background: transparent; border: 0; cursor: pointer; padding: 6px; margin-right: 4px; color: #000; display: flex; border-radius: 8px; }
    .menu-btn:hover { background: rgba(0,0,0,.05); }
    .menu-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .logo-link { display: flex; cursor: pointer; }
    .logo { width: 128px; height: 32px; display: block; }
    .spacer { flex: 1; }
    .appbar-right { display: flex; align-items: center; gap: 16px; }
    .icon-btn { background: transparent; border: 0; cursor: pointer; color: #000; display: flex; padding: 4px; }
    .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #4a4a4a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .user .name { font-size: 14px; color: #000; }
    .caret { width: 20px; height: 20px; fill: #000; }
    .crumbs { background: #E4E6EC; padding: 20px 32px 22px; }
    .crumb-title { font-size: 18px; font-weight: 700; color: #333; margin: 0; }
    .overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1300; }
    [hidden] { display: none !important; }

    /* ── History page ─────────────────────────────────────────────────── */
    .page { padding: 28px 32px 64px; max-width: 900px; margin: 0 auto; }
    .sub { margin: 0 0 20px; color: #555; font-size: 14px; }

    .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    .seg { display: inline-flex; background: #fff; border: 1px solid #DCDBDB; border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: transparent; font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: #333; }
    .seg button.on { background: #1a1a1a; color: #fff; }
    .search { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #DCDBDB; border-radius: 8px; padding: 0 10px; }
    .search:focus-within { border-color: #1a1a1a; }
    .search svg { width: 18px; height: 18px; fill: #777; flex: none; }
    .search input { border: 0; outline: 0; font: inherit; font-size: 14px; padding: 8px 0; width: 100%; background: transparent; }

    /* Day group: one white card per day, one quiet line per entry. */
    .day { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: #666; margin: 26px 0 8px 2px; }
    .card { background: #fff; border: 1px solid #DCDBDB; border-radius: 12px; overflow: hidden; }
    .row + .row { border-top: 1px solid #efeff1; }

    .head { display: grid; grid-template-columns: 44px 18px minmax(0, 1fr) auto 20px; align-items: center; column-gap: 12px; padding: 12px 14px; cursor: pointer; }
    .head:hover { background: #fafafb; }
    .head .t { font-size: 12px; color: #666; font-variant-numeric: tabular-nums; }
    .head .ic svg { width: 18px; height: 18px; fill: #555; display: block; }
    .sum { font-size: 14px; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sum .sec { color: #666; margin-left: 8px; }
    .aside { display: flex; align-items: center; gap: 8px; }
    .aside .count { font-size: 12px; color: #666; }
    .pill { font-size: 11px; font-weight: 600; color: #444; border: 1px solid #bbb; border-radius: 10px; padding: 0 7px; line-height: 18px; }
    .chev { width: 20px; height: 20px; fill: #666; transition: transform .15s; }
    .row.open .chev { transform: rotate(180deg); }

    /* Undo on the line only appears on hover (and always inside the open panel). */
    .head .ghost { opacity: 0; transition: opacity .12s; }
    .head:hover .ghost, .head .ghost:focus-visible { opacity: 1; }
    .ghost { background: none; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: #1a1a1a; padding: 4px 8px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
    .ghost svg { width: 16px; height: 16px; fill: currentColor; }
    .ghost:hover { background: #ededf0; }

    /* Undone line: struck through, still readable. */
    .row.undone .sum { color: #666; text-decoration: line-through; text-decoration-color: #888; }
    .row.undone .ic svg { fill: #999; }

    /* Expanded panel — aligned with the summary column. */
    .panel { padding: 2px 48px 16px 102px; font-size: 13px; color: #333; }
    .diff { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
    .diff .f { color: #666; }
    .diff .old { color: #666; text-decoration: line-through; }
    .diff .new { color: #1a1a1a; font-weight: 600; }
    .diff .arr { color: #777; }
    .facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: #444; }
    .facts b { color: #1a1a1a; }
    .sect { margin-top: 14px; }
    .sect h4 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #666; }
    .sect table { width: 100%; border-collapse: collapse; }
    .sect td { padding: 5px 0; border-bottom: 1px solid #f2f2f4; vertical-align: top; }
    .sect td:first-child { width: 42%; color: #1a1a1a; padding-right: 12px; }
    .sect td:last-child { color: #555; }
    .sect .more { font-size: 12px; color: #666; padding: 5px 0; }
    .fix { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 5px 0; border-bottom: 1px solid #f2f2f4; }
    .fix .what { color: #1a1a1a; }
    .fix .what .diff { font-size: 13px; margin-left: 8px; }
    .fix .when { font-size: 12px; color: #666; white-space: nowrap; }
    .fix.undone .what { color: #666; text-decoration: line-through; text-decoration-color: #888; }
    .fix.undone .diff .new { color: #666; font-weight: 500; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #efeff1; }
    .foot .meta { font-size: 12px; color: #666; }
    .btn-o { background: #fff; border: 1px solid #1a1a1a; color: #1a1a1a; font: inherit; font-size: 13px; font-weight: 600; border-radius: 8px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-o svg { width: 16px; height: 16px; fill: currentColor; }
    .btn-o:hover { background: #f1f1f4; }
    .muted { color: #666; font-size: 12px; }
    .row.flash .head { background: #f0f0f2; transition: background .6s; }

    .empty { text-align: center; color: #777; padding: 48px 0; font-size: 14px; }

    /* Source files: thumbnails, click to enlarge */
    .thumbs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
    .thumb { width: 168px; background: none; border: 0; padding: 0; font: inherit; text-align: left; cursor: zoom-in; }
    .thumb .img { display: block; position: relative; width: 168px; height: 108px; border: 1px solid #e2e2e6; border-radius: 8px; overflow: hidden; background: #f5f5f7 center top / cover no-repeat; transition: border-color .12s, box-shadow .12s; }
    .thumb:hover .img, .thumb:focus-visible .img { border-color: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .thumb .ext { position: absolute; left: 6px; bottom: 6px; background: #1a1a1a; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 2px 5px; border-radius: 4px; }
    .thumb .nm { display: block; max-width: 168px; margin-top: 5px; font-size: 12px; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thumb.noprev { cursor: default; }
    .thumb.noprev .img { display: flex; align-items: center; justify-content: center; }
    .thumb.noprev .img svg { width: 34px; height: 34px; fill: #999; }
    .lb { position: fixed; inset: 0; background: rgba(10,10,12,.88); z-index: 2100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 72px 24px; cursor: zoom-out; }
    .lb img { max-width: 100%; max-height: calc(100vh - 120px); border-radius: 6px; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.4); cursor: default; }
    .lb .cap { color: #fff; font-size: 14px; margin-top: 12px; }
    .lb .cap span { color: #bbb; margin-left: 8px; }
    .lb button { position: absolute; background: rgba(255,255,255,.12); border: 0; color: #fff; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .lb button:hover { background: rgba(255,255,255,.24); }
    .lb button svg { width: 24px; height: 24px; fill: #fff; }
    .lb .x { top: 12px; right: 12px; }
    .lb .pv { left: 16px; top: 50%; transform: translateY(-50%); }
    .lb .nx { right: 16px; top: 50%; transform: translateY(-50%); }

    /* Confirm dialog */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .modal { background: #fff; border-radius: 12px; width: 480px; max-width: 100%; padding: 22px 24px 18px; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
    .modal h3 { margin: 0 0 6px; font-size: 18px; }
    .modal p { margin: 0 0 12px; font-size: 14px; color: #555; line-height: 1.5; }
    .modal .box { background: #f5f5f7; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #333; margin-bottom: 10px; line-height: 1.6; }
    .modal .box b { display: block; color: #1a1a1a; margin-bottom: 2px; }
    .modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
    .btn.primary { background: #1a1a1a; color: #fff; border: 1px solid #1a1a1a; }
    .btn.primary:hover { background: #000; }
    .btn.text { background: none; border: 0; color: #333; }
    .btn.text:hover { background: #f1f1f4; }

    /* Toast */
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; background: #1a1a1a; color: #fff; border-radius: 8px; padding: 10px 10px 10px 16px; font-size: 14px; display: flex; align-items: center; gap: 12px; transition: all .2s; z-index: 2100; }
    .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
    .toast button { background: none; border: 0; color: #fff; font: inherit; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 4px 6px; }

    @media (max-width: 640px) {
      .page { padding: 16px 16px 48px; }
      .head { grid-template-columns: 40px minmax(0, 1fr) auto 20px; }
      .head .ic { display: none; }
      .head .aside .count { display: none; }
      .panel { padding: 2px 14px 16px; }
    }
  </style>
</head>

      return p && p.undone ? '' : `<button class="${cls}" data-redo="${e.id}">${svg('redo')}Redo</button>`;
    }
    return expired(e) ? '' : `<button class="${cls}" data-undo="${e.id}">${svg('undo')}${e.type === 'import' && cls === 'btn-o' ? 'Undo import' : 'Undo'}</button>`;
  }
  const undoneText = (e) => e.undone ? `Undone${e.undone.cascade ? ' with the import' : ''} ${ago(d(e.undone.at))}` : '';

  function fixHtml(f, day) {
    return `<div class="fix${f.undone ? ' undone' : ''}" id="${f.id}">
      <div class="what">${f.by !== 'You' ? `${esc(f.by)}: ` : ''}${target(f)}${diff(f)}</div>
      <span class="when">${f.undone ? undoneText(f) : timeIn(d(f.at), day)}</span>
      <span>${action(f, 'ghost')}</span>
    </div>`;
  }

  const FILEIC = '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8zm4 18H6V4h7v5h5z"/></svg>';
  const extOf = (f) => f.split('.').pop().toUpperCase();
  function thumbsHtml(e) {
    const pv = e.previews || {};
    return `<div class="thumbs">${e.files.map(f => pv[f]
      ? `<button class="thumb" data-zoom="${e.id}" data-file="${esc(f)}" title="Enlarge ${esc(f)}"><span class="img" style="background-image:url('${pv[f]}')"><span class="ext">${extOf(f)}</span></span><span class="nm">${esc(f)}</span></button>`
      : `<div class="thumb noprev" title="No preview"><span class="img">${FILEIC}<span class="ext">${extOf(f)}</span></span><span class="nm">${esc(f)}</span></div>`).join('')}</div>`;
  }

  // Lightbox: enlarges a source file; arrows step through the import's files.
  let lb = null;
  function openLb(e, file) {
    const list = e.files.filter(f => (e.previews || {})[f]);
    lb = { e, list, i: Math.max(0, list.indexOf(file)) }; drawLb();
  }
  function drawLb() {
    const { e, list, i } = lb, f = list[i], many = list.length > 1;
    document.getElementById('modalRoot').innerHTML = `<div class="lb" id="lb">
      <button class="x" data-lb="close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
      ${many ? `<button class="pv" data-lb="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button><button class="nx" data-lb="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>` : ''}
      <img src="${e.previews[f]}" alt="${esc(f)}">
      <div class="cap">${esc(f)}${many ? `<span>${i + 1} / ${list.length}</span>` : ''}</div>
    </div>`;
    document.getElementById('lb').onclick = (ev) => {
      const b = ev.target.closest('[data-lb]');
      if (b && b.dataset.lb !== 'close') { stepLb(b.dataset.lb === 'next' ? 1 : -1); return; }
      if (ev.target.tagName !== 'IMG') closeLb();
    };
  }
  const stepLb = (n) => { lb.i = (lb.i + n + lb.list.length) % lb.list.length; drawLb(); };
  const closeLb = () => { lb = null; document.getElementById('modalRoot').innerHTML = ''; };

  function panelHtml(e) {
    const day = dayKey(d(e.at));
    let h = '';
    if (e.type === 'import') {
      h += `<div class="facts">${e.facts.map(([n, w]) => `<span><b>${n}</b> ${w}</span>`).join('')}</div>`;
      h += thumbsHtml(e);
      const fixes = fixesOf(e);
      if (fixes.length) h += `<div class="sect"><h4>Fixed since import</h4>${fixes.map(f => fixHtml(f, day)).join('')}</div>`;
      h += e.groups.map(g => `<div class="sect"><h4>${esc(g.label)}</h4><table>${g.rows.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join('')}</table>${g.more ? `<div class="more">+ ${g.more} more</div>` : ''}</div>`).join('');
    } else if (e.type === 'delete') {
      h += `<div class="diff"><span class="f">Treatment</span><span class="new">${esc(e.what)}</span><span class="old">${esc(e.detail)}</span></div>`;
    } else {
      h += diff(e);
    }
    const meta = [e.by, e.via, `${short(d(e.at))}, ${hm(d(e.at))}`].map(esc).join(' · ');
    const status = e.undone ? ` · <b>${undoneText(e)}</b>` : (expired(e) ? ' · Undo no longer available (older than 30 days)' : '');
    return `<div class="panel"><div>${h}</div><div class="foot"><span class="meta">${meta}${status}</span>${action(e, 'btn-o')}</div></div>`;
  }

  function rowHtml(e) {
    const isOpen = open.has(e.id);
    const fixes = e.type === 'import' ? fixesOf(e).filter(f => !f.undone).length : 0;
    const aside = [
      e.undone ? '<span class="pill">Undone</span>' : '',
      fixes ? `<span class="count">${fixes} fix${fixes > 1 ? 'es' : ''}</span>` : '',
      e.type === 'import' && !e.undone ? `<span class="count">${(([n, w]) => `${n} ${w}`)(e.facts.find(f => /treatment/.test(f[1])) || e.facts[0])}</span>` : '',
      isOpen ? '' : action(e, 'ghost'),
    ].join('');
    return `<div class="row${e.undone ? ' undone' : ''}${isOpen ? ' open' : ''}" id="${e.id}">
      <div class="head" data-toggle="${e.id}" role="button" aria-expanded="${isOpen}">
        <span class="t">${hm(d(e.at))}</span>
        <span class="ic">${svg(e.type)}</span>
        <span class="sum">${summary(e)}</span>
        <span class="aside">${aside}</span>
        ${CHEV}
      </div>
      ${isOpen ? panelHtml(e) : ''}
    </div>`;
  }

  function render() {
    document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.f === filter));
    const tops = entries.filter(e => !e.parent).filter(matches).sort((a, b) => d(b.at) - d(a.at));
    if (!tops.length) { document.getElementById('list').innerHTML = `<div class="empty">Nothing matches “${esc(q)}”.</div>`; return; }
    let html = '', cur = '';
    tops.forEach(e => {
      const k = dayKey(d(e.at));
      if (k !== cur) { if (cur) html += '</div>'; cur = k; html += `<div class="day">${dayLabel(d(e.at))}</div><div class="card">`; }
      html += rowHtml(e);
    });
    document.getElementById('list').innerHTML = html + '</div>';
  }

  // ── Undo / redo ─────────────────────────────────────────────────────────
  const stamp = (extra) => ({ at: NOW.toISOString(), by: 'You', ...extra });
  function doUndo(e) {
    fixesOf(e).filter(f => !f.undone).forEach(f => { f.undone = stamp({ cascade: true }); });
    e.undone = stamp();
    render(); flash(e.id);
    toast(e.type === 'import' ? 'Import undone' : (e.type === 'delete' ? 'Treatment restored' : 'Change undone'), 'Redo', () => doRedo(e));
  }
  function doRedo(e) {
    delete e.undone;
    fixesOf(e).filter(f => f.undone && f.undone.cascade).forEach(f => delete f.undone);
    render(); flash(e.id);
    toast(e.type === 'import' ? 'Import restored' : 'Change redone', 'Undo', () => doUndo(e));
  }

  // A single edit undoes straight away (toast offers Redo). An import asks first.
  function askUndo(e) {
    if (e.type !== 'import') return doUndo(e);
    const live = fixesOf(e).filter(f => !f.undone);
    const fixBox = live.length ? `<div class="box"><b>${live.length} ${live.length === 1 ? 'fix' : 'fixes'} since import will be undone too</b>
      ${live.map(f => `${esc(f.what === 'plot' ? 'Plot' : f.what)} · ${esc(f.plot)} — ${esc(f.field)} ${esc(f.from)} → ${esc(f.to)} <span style="color:#888">· ${esc(f.by)}</span>`).join('<br>')}</div>` : '';
    const fcBox = e.forecast ? `<div class="box"><b>Forecasts affected</b>${esc(e.forecast)}</div>` : '';
    const n = e.facts.map(([n, w]) => `${n} ${w}`).join(', ');
    document.getElementById('modalRoot').innerHTML = `
      <div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">
        <h3>Undo import of ${esc(e.files[0])}${e.files.length > 1 ? ` + ${e.files.length - 1}` : ''}?</h3>
        <p>Removes everything this import added (${n}) and restores previous values. You can redo it afterwards.</p>
        ${fixBox}${fcBox}
        <div class="actions"><button class="btn text" id="mCancel">Cancel</button><button class="btn primary" id="mOk">Undo import</button></div>
      </div></div>`;
    const close = () => { document.getElementById('modalRoot').innerHTML = ''; };
    document.getElementById('mCancel').onclick = close;
    document.getElementById('mbg').onclick = (ev) => { if (ev.target.id === 'mbg') close(); };
    document.getElementById('mOk').onclick = () => { close(); doUndo(e); };
  }

  // ── Toast + flash ───────────────────────────────────────────────────────
  let tTimer;
  function toast(msg, act, fn) {
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    const b = document.getElementById('toastAct');
    b.textContent = act; b.onclick = () => { t.classList.remove('show'); fn(); };
    t.classList.add('show'); clearTimeout(tTimer);
    tTimer = setTimeout(() => t.classList.remove('show'), 6000);
  }
  function flash(id) {
    const el = document.getElementById(id); if (!el) return;
    el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 700);
  }

  // ── Wiring ──────────────────────────────────────────────────────────────
  document.getElementById('seg').addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    filter = b.dataset.f; render();
  });
  document.getElementById('q').addEventListener('input', (ev) => { q = ev.target.value.trim().toLowerCase(); render(); });
  document.getElementById('list').addEventListener('click', (ev) => {
    const z = ev.target.closest('[data-zoom]');
    if (z) { openLb(byId[z.dataset.zoom], z.dataset.file); return; }
    const u = ev.target.closest('[data-undo]'), r = ev.target.closest('[data-redo]'), t = ev.target.closest('[data-toggle]');
    if (u) askUndo(byId[u.dataset.undo]);
    else if (r) doRedo(byId[r.dataset.redo]);
    else if (t) { const id = t.dataset.toggle; open.has(id) ? open.delete(id) : open.add(id); render(); }
  });
  document.addEventListener('keydown', (ev) => {
    if (lb && ev.key === 'ArrowRight') return stepLb(1);
    if (lb && ev.key === 'ArrowLeft') return stepLb(-1);
    if (ev.key === 'Escape') { lb = null; document.getElementById('modalRoot').innerHTML = ''; }
  });
  render();
  </script>
</body>
</html>
