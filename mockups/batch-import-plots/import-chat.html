<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ResiYou — Import assistant (mockup)</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    body { background: #e9eaee; }
    .frame { position: relative; min-height: 100vh; max-width: 1260px; margin: 0 auto; background: #f5f5f7; }

    /* Top app bar — same elements as the Plots screenshot. */
    .appbar {
      height: 60px; display: flex; align-items: center; gap: 8px;
      padding: 0 24px; background: #fff; border-bottom: 1px solid #DCDBDB;
      position: relative; z-index: 1;
    }
    .menu-btn { background: transparent; border: 0; cursor: pointer; padding: 6px; margin-right: 4px; color: #000; display: flex; border-radius: 8px; }
    .menu-btn:hover { background: rgba(0,0,0,.05); }
    .menu-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .logo-link { display: flex; cursor: pointer; }
    .logo { width: 128px; height: 32px; display: block; }
    .spacer { flex: 1; }
    .appbar-right { display: flex; align-items: center; gap: 16px; }
    .icon-btn { background: transparent; border: 0; cursor: pointer; color: #000; display: flex; padding: 4px; }
    .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
    .user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #4a4a4a; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 400; }
    .user .name { font-size: 14px; color: #000; }
    .caret { width: 20px; height: 20px; fill: #000; }

    /* Header title band — grey band under the app bar (matches the real ResiYou header). */
    .crumbs { background: #E4E6EC; padding: 20px 32px 22px; }
    .crumb-title { font-size: 18px; font-weight: 700; color: #333; margin: 0; }

    /* Page body. */
    .page { padding: 24px 32px 48px; }
    /* ── Chat-only import ─────────────────────────────────────────────── */
    .page { padding: 0; }
    .chatwrap { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; height: calc(100vh - 60px - 63px); }
    .strip { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px; margin: 12px 16px 0; background: #fff; border: 1px solid #DCDBDB; border-radius: 10px; font-size: 13px; color: #333; }
    .strip .files { display: flex; gap: 6px; align-items: center; color: #6b6b6b; min-width: 0; }
    .strip .files svg { width: 16px; height: 16px; fill: #6b6b6b; flex: none; }
    .strip .stat b { font-weight: 700; color: #1a1a1a; }
    .strip .left { margin-left: auto; color: #1a1a1a; font-weight: 600; }
    .strip .left.ok { color: #2e7d32; }
    .thread { flex: 1; overflow-y: auto; padding: 20px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
    .msg { display: flex; gap: 10px; max-width: 100%; }
    .msg.me { align-self: flex-end; flex-direction: row-reverse; max-width: 85%; }
    .msg .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; }
    .msg.bot .av { background: #ededf0; }
    .msg.bot .av svg { width: 18px; height: 18px; fill: #1a1a1a; }
    .msg.me .av { background: #4a4a4a; color: #fff; font-size: 14px; }
    .bubble { background: #fff; border: 1px solid #DCDBDB; border-radius: 4px 14px 14px 14px; padding: 10px 14px; font-size: 14px; line-height: 1.5; color: #1a1a1a; min-width: 0; }
    .msg.bot .bubble { max-width: 700px; }
    .msg.me .bubble { background: #1a1a1a; border-color: #1a1a1a; color: #fff; border-radius: 14px 4px 14px 14px; }
    .bubble p { margin: 0 0 6px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble .ack { color: inherit; font-weight: 400; }
    .bubble .muted { color: inherit; font-size: inherit; }
    .bubble code { background: #f1f1f4; border-radius: 4px; padding: 0 4px; font-size: 13px; }
    .change { display: block; text-align: right; margin-top: 4px; font-size: 12px; color: #6b6b6b; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; font-size: 12px; }
    .change:hover { color: #1a1a1a; text-decoration: underline; }
    .snip { overflow-x: auto; border: 1px solid #DCDBDB; border-radius: 8px; margin: 14px 0 10px; background: #fff; }
    .snip .crop { position: relative; width: 820px; background-size: 820px auto; background-repeat: no-repeat; }
    .snip .crop + .crop { border-top: 2px solid #1a1a1a; }
    .snip .hl { position: absolute; border: 2px solid #f59e0b; background: rgba(251, 191, 36, .25); border-radius: 3px; box-sizing: border-box; }
    .snip .hl.head { border-style: dashed; background: rgba(251, 191, 36, .12); }
    .snip .hl-key { display: inline-block; width: 10px; height: 10px; border: 2px solid #f59e0b; background: rgba(251, 191, 36, .25); border-radius: 2px; vertical-align: -1px; }
    .snip .cap { font-size: 11px; color: #6b6b6b; padding: 4px 8px; border-top: 1px solid #eee; position: sticky; left: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .chip { border: 1px solid #1a1a1a; color: #1a1a1a; background: #fff; border-radius: 18px; padding: 6px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
    .chip:hover { background: #ededf0; }
    .chip .rec { font-weight: 400; color: #6b6b6b; margin-left: 4px; }
    .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding: 10px; background: #f7f7f9; border-radius: 8px; }
    .pchip { border: 1px solid #DCDBDB; background: #fff; border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
    .pchip.on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
    .pick .done { margin-left: auto; }
    .kv { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 13px; }
    .kv th { text-align: left; font-weight: 600; color: #6b6b6b; font-size: 12px; padding: 4px 8px; border-bottom: 1px solid #DCDBDB; }
    .kv td { padding: 5px 8px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    .kv td.arrow { color: #6b6b6b; width: 16px; padding: 5px 0; }
    .kv .soft { color: #6b6b6b; font-size: 12px; }
    .tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; }
    .tag.new { background: #e3f2fd; color: #1565c0; }
    .tag.ok { background: #e8f5e9; color: #2e7d32; }
    .tag.ask { background: #ededf0; color: #1a1a1a; }
    details.more { margin-top: 6px; font-size: 13px; }
    details.more summary { cursor: pointer; color: #1a1a1a; font-weight: 600; }
    .files-msg { display: flex; gap: 8px; flex-wrap: wrap; }
    .file { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.14); border-radius: 8px; padding: 6px 10px 6px 6px; }
    .file .thumb { width: 64px; height: 44px; border-radius: 4px; background-size: cover; background-position: top left; background-color: #fff; }
    .file .nm { font-size: 13px; font-weight: 600; } .file .sz { font-size: 11px; opacity: .8; }
    .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: #bbb; animation: blink 1s infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .3; } 40% { opacity: 1; } }
    .primary { background: #1a1a1a; color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .primary:hover { background: #000; }
    .bubble a { color: #1a1a1a; }
    .composer { padding: 8px 16px 18px; }
    .composer form { display: flex; align-items: flex-end; gap: 6px; background: #fff; border: 1px solid #DCDBDB; border-radius: 14px; padding: 6px; }
    .composer form:focus-within { border-color: #1a1a1a; }
    .composer textarea { flex: 1; border: 0; outline: 0; resize: none; font: inherit; font-size: 14px; padding: 8px 6px; height: 38px; max-height: 120px; background: transparent; }
    .composer .ib { width: 38px; height: 38px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none; }
    .composer .ib svg { width: 22px; height: 22px; fill: #6b6b6b; }
    .composer .ib:hover { background: #f1f1f4; }
    .composer .send { background: #1a1a1a; } .composer .send svg { fill: #fff; } .composer .send:hover { background: #000; }
    .composer .hint { font-size: 11px; color: #9a9a9a; text-align: center; margin-top: 6px; }
    .drop { border: 2px dashed #DCDBDB; border-radius: 12px; padding: 22px 18px 18px; text-align: center; color: #6b6b6b; font-size: 13px; margin-top: 10px; cursor: pointer; }
    .drop:hover { border-color: #1a1a1a; color: #1a1a1a; }
    .ftypes { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; margin: 4px 0 14px; }
    .ftype { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 92px; }
    .fdoc { position: relative; width: 48px; height: 60px; }
    .fdoc svg { width: 48px; height: 60px; display: block; }
    .fext { position: absolute; left: -6px; bottom: 8px; background: #1a1a1a; color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .04em; border-radius: 3px; padding: 1px 5px; }
    .flbl { font-size: 12px; color: #444; text-align: center; line-height: 1.3; }
    .drop:hover .fdoc svg path:first-child, .drop:hover .fdoc svg rect { stroke: #1a1a1a; }
    .dhint { font-size: 13px; color: #555; }
    [hidden] { display: none !important; }
    .overlay { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1300; }
  </style>
</head>

  <script src="diary-data.js"></script>
  <script>
    // Chat-only import: the assistant reads the Turkish diaries (diary-data.js),
    // matches what it can by itself, and asks one question at a time about the
    // rest. Every answer updates the draft (strip at the top) right away.
    const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const BOT_ICO = '<svg viewBox="0 0 24 24"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25z"/></svg>';
    const FILE_ICO = '<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8zm4 18H6V4h7v5h5z"/></svg>';
    const SKIP_V = '__skip';
    const PLOT_NAMES = DIARY_PLOTS.map(p => p.name);
    const sum = (a) => a.reduce((x, y) => x + y, 0);

    // ── Resolving rows with the answers so far ────────────────────────────
    let A;               // answers by question id
    const newPlots = () => [['kanal', 'Kanal altı'], ['organik', 'Organik']].filter(([id]) => A[id] === NEW_PLOT).map(([, n]) => n);
    const farm = () => [...PLOT_NAMES, ...newPlots()];
    const isRel = (s) => ['tümalan', 'kalankisim'].includes(nk(s));
    const prevExplicit = (r) => { const xs = DIARY_ROWS.filter(x => x.src === r.src && x.line < r.line && !isRel(x.parcels)); return xs[xs.length - 1]; };
    const pickedOr = (v, fallback) => Array.isArray(v) ? v : v === undefined ? null : fallback();
    function tokenPlots(t, r) {
      const k = nk(t);
      if (PLOT_NAMES.includes(t)) return [t];
      if (k === 'bc/a') return A.bca ? [A.bca] : null;
      if (k === 'kanalalti') return A.kanal === undefined ? null : A.kanal === SKIP_V ? [] : A.kanal === NEW_PLOT ? ['Kanal altı'] : [A.kanal];
      if (k === 'organik') return A.organik === undefined ? null : A.organik === SKIP_V ? [] : A.organik === NEW_PLOT ? ['Organik'] : [A.organik];
      if (k === 'tümalan') return pickedOr(A.tum, () => A.tum === ALL_NO_ORG ? farm().filter(n => n !== 'Organik') : farm());
      if (k === 'kalankisim') return pickedOr(A.kalan, () => { const prev = rowPlots(prevExplicit(r)) || []; return farm().filter(n => !prev.includes(n)); });
      return [];
    }
    // null = still waiting for an answer.
    function rowPlots(r) {
      const out = [];
      for (const t of parseParcels(r.parcels).tokens) { const ps = tokenPlots(t, r); if (ps === null) return null; ps.forEach(p => out.includes(p) || out.push(p)); }
      return out;
    }
    function rowProduct(r) {
      const k = nk(productKey(r));
      if (k === 'decis') return A.decis || null;
      if (k === 'delegate') return A.delegate === undefined ? null : A.delegate === SKIP_V ? SKIP_V : 'Delegate 250 WG';
      return (byKey(PRODUCT_ALIASES)[k] || [])[0] || null;
    }
    const rowReady = (r) => rowPlots(r) !== null && rowProduct(r) !== null;
    const rowTreatments = (r) => rowReady(r) && rowProduct(r) !== SKIP_V ? rowPlots(r).length : 0;
    const totalTreatments = () => sum(DIARY_ROWS.map(rowTreatments));
    const plotsTouched = () => new Set(DIARY_ROWS.filter(r => rowTreatments(r)).flatMap(rowPlots)).size;
    const rowsOf = (pred) => DIARY_ROWS.filter(pred);
    const hasTok = (k) => (r) => parseParcels(r.parcels).tokens.some(t => nk(t) === k);
    const plotsLabel = (ps) => ps.length > 8 ? `${ps.slice(0, 7).join(', ')} +${ps.length - 7} more` : ps.join(', ');

    // ── Source snippets: crops of the real files ──────────────────────────
    // Column x-bounds in the 2000-wide reference (same scale as the row y-bounds).
    const COLS = {
      xlsx: { parcels: [15, 228, 'Uygulanan Parseller'], date: [228, 498, 'Uygulama Tarihi'], ai: [498, 800, 'Etkili Madde'], trade: [800, 1098, 'Ticari Adı'],
              dose: [1098, 1375, 'Doz'], method: [1375, 1572, 'Uygulama Metodu'], phi: [1572, 1775, 'Bekleme Süresi'], water: [1775, 2000, 'Toplam Kullanılan Su Miktarı'] },
      scan: { parcels: [30, 155, 'Uygulanan Parseller'], date: [155, 288, 'Uygulama Tarihi'], ai: [288, 466, 'Etkili Madde'], trade: [466, 642, 'Ticari Adı'],
              dose: [642, 798, 'Doz'], method: [798, 995, 'Uygulama Metodu'], phi: [995, 1128, 'Bekleme Süresi'], harvest: [1128, 1278, 'Uygun Hasat Tarihi'], reason: [1278, 1528, 'Uygulama Nedeni'] },
    };
    // snip(src, row ranges, caption, cols, lines): crops of header + rows; the cells
    // of `cols` × `lines` are outlined, plus their header cell (dashed).
    function snip(src, ranges, cap, cols = [], lines = []) {
      const S = SOURCES[src], k = 820 / 2000, px = (v) => Math.round(v * k);
      const rowY = (n) => DIARY_ROWS.find(r => r.src === src && r.line === n).y;
      const boxes = [...cols.map(c => [c, S.head, true]), ...cols.flatMap(c => lines.map(n => [c, rowY(n), false]))];
      const crop = ([y0, y1]) => {
        const hl = boxes.filter(([, [b0, b1]]) => b0 < y1 && b1 > y0).map(([c, [b0, b1], head]) => {
          const [x0, x1] = COLS[src][c], t = Math.max(b0, y0), b = Math.min(b1, y1);
          return `<i class="hl${head ? ' head' : ''}" style="left:${px(x0)}px;width:${px(x1 - x0)}px;top:${px(t - y0)}px;height:${px(b - t)}px"></i>`;
        }).join('');
        return `<div class="crop" style="height:${px(y1 - y0)}px;background-image:url(${S.img});background-position:0 -${px(y0)}px">${hl}</div>`;
      };
      return `<div class="snip" data-focus="${cols.length ? px(COLS[src][cols[0]][0]) : 0}">${crop(S.head)}${ranges.map(crop).join('')}</div>`;
    }
    const xRow = (n) => DIARY_ROWS.find(r => r.src === 'xlsx' && r.line === n).y;
    const sRow = (n) => DIARY_ROWS.find(r => r.src === 'scan' && r.line === n).y;

    // ── Questions ─────────────────────────────────────────────────────────
    // Each: html, snippet, options [{label, value, re, rec, ack}], optional picker.
    const QUESTIONS = {
      columns: () => ({
        html: `<p>Here's how I read your columns into ResiYou treatment fields:</p>
          <table class="kv"><tr><th>Your column</th><th></th><th>ResiYou field</th></tr>
          ${[['Uygulanan Parseller · Parsel', 'Plot', 'shorthand lists like “A5-6-7” are split per plot'],
             ['Uygulama Tarihi · Tarih', 'Application date', ''],
             ['Ticari Adı', 'Product', 'active substance column used to double-check'],
             ['Doz (g / 100 l)', 'Dose', 'per 100 l of water'],
             ['Toplam Kullanılan Su Miktarı', 'Water volume', 'unit unclear — I\'ll ask'],
             ['Bekleme Süresi', 'PHI (days)', ''],
             ['Neden (scan)', 'Target', 'e.g. “Kiraz sineği” = cherry fruit fly'],
             ['Hasat Tarihi (scan)', '—', 'no treatment field for this']]
            .map(([a, b, c]) => `<tr><td>${esc(a)}</td><td class="arrow">→</td><td>${esc(b)}${c ? `<div class="soft">${esc(c)}</div>` : ''}</td></tr>`).join('')}</table>
          <p>Your scan also has a <b>harvest date</b> per spray. ResiYou doesn't store it, but I can use it to double-check your PHI days. Should I?</p>`,
        snip: snip('scan', [sRow(1)], 'header + row 1', ['harvest'], [1]),
        options: [
          { label: 'Yes, double-check', value: 'use', rec: true, re: /yes|ja|check|use|ok|sure|evet/i, ack: () => 'I\'ll check that spray date + PHI fits your harvest date.' },
          { label: 'No, ignore it', value: 'ignore', re: /ignore|no|nein|skip|hayır/i, ack: () => 'Harvest dates will be ignored.' },
        ],
      }),
      bca: () => ({
        html: `<p>All 12 scan rows are on <code>B C/A 21,2 da</code> (written three ways). That isn't a plot code, but <b>21,2 da = 2.12 ha</b> — exactly the size of your plot <b>B1</b>.</p><p>Is it B1?</p>`,
        snip: snip('scan', [[sRow(1)[0], sRow(3)[1]]], 'rows 1–3', ['parcels'], [1, 2, 3]),
        options: [
          { label: 'Yes, it\'s B1', value: 'B1', rec: true, re: /yes|ja|right|correct|evet|b1\b/i },
          { label: 'No, another plot', pick: 'single' },
        ],
        ack: (v) => `${v} gets the 12 treatments from the scan.`,
      }),
      kanal: () => ({
        html: `<p><code>Kanal altı</code> (“below the canal”) appears in ${rowsOf(hasTok('kanalalti')).length} Excel rows between your A and B plots, but none of your plots is called that.</p>`,
        snip: snip('xlsx', [xRow(1)], 'row 1', ['parcels'], [1]),
        options: [
          { label: 'Create plot “Kanal altı”', value: NEW_PLOT, rec: true, re: /new|create|neu|anlegen|yeni/i, ack: () => 'New draft plot “Kanal altı” — add crop and area later.' },
          { label: 'It\'s one of my plots', pick: 'single' },
          { label: 'Leave it out', value: SKIP_V, re: /skip|leave|ignore|weg|nicht/i, ack: () => 'Kanal altı is left out.' },
        ],
        ack: (v) => `Kanal altı = ${v}.`,
      }),
      organik: () => ({
        html: `<p>The last two Excel rows list <code>B1-2-3-4-5-Organik-20da-55da-40 da</code>. B1–B5 are yours; <code>Organik</code> isn't. The areas after it add up to 115 da (11.5 ha).</p>`,
        snip: snip('xlsx', [[xRow(16)[0], xRow(17)[1]]], 'rows 16–17', ['parcels'], [16, 17]),
        options: [
          { label: 'Create plot “Organik”', value: NEW_PLOT, rec: true, re: /new|create|neu|anlegen|yeni/i, ack: () => 'New draft plot “Organik”, 11.5 ha.' },
          { label: 'It\'s one of my plots', pick: 'single' },
          { label: 'Leave it out', value: SKIP_V, re: /skip|leave|ignore|weg|nicht/i, ack: () => 'Organik is left out.' },
        ],
        ack: (v) => `Organik = ${v}.`,
      }),
      kalan: () => {
        const prev = rowPlots(prevExplicit(DIARY_ROWS.find(r => r.src === 'xlsx' && r.line === 2)));
        const rest = farm().filter(n => !prev.includes(n));
        return {
          html: `<p><code>kalan kısım</code> means “the remaining part”. It's in ${rowsOf(hasTok('kalankisim')).length} rows, each right after a row that lists A1–A10, B1, B7${A.kanal === NEW_PLOT ? ' and Kanal altı' : ''}.</p>
            <p>So I read it as the rest of the farm: <b>${esc(plotsLabel(rest))}</b>. Right?</p>`,
          snip: snip('xlsx', [[xRow(5)[0], xRow(6)[1]]], 'rows 5–6', ['parcels'], [5, 6]),
          options: [
            { label: `Yes, those ${rest.length} plots`, value: REST_PLOTS, rec: true, re: /yes|ja|right|correct|rest|evet/i },
            { label: 'Let me pick', pick: 'multi', preset: rest },
          ],
          ack: () => { const r = DIARY_ROWS.find(x => x.src === 'xlsx' && x.line === 2); return `“kalan kısım” → ${plotsLabel(rowPlots(r))}.`; },
        };
      },
      tum: () => {
        const org = A.organik === NEW_PLOT;
        const n = rowsOf(hasTok('tümalan')).length;
        return {
          html: `<p><code>tüm alan</code> means “the whole area”. It's used for ${n} sprays in April–June (Lamdex, Decis, Mospilan, Delegate).</p>
            ${org ? '<p>Did these also go on <b>Organik</b>? Organic plots usually don\'t get synthetic insecticides like these.</p>' : `<p>I'll put them on all ${farm().length} plots. OK?</p>`}`,
          snip: snip('xlsx', [[xRow(7)[0], xRow(9)[1]]], 'rows 7–9 of 8 “tüm alan” rows', ['parcels'], [7, 8, 9]),
          options: org ? [
            { label: 'Every plot except Organik', value: ALL_NO_ORG, rec: true, prio: 1, re: /except|without|ohne|not|nicht|no\b|nein|hariç/i },
            { label: 'Yes, Organik too', value: ALL_PLOTS, re: /yes|ja|too|auch|all|every|evet/i },
            { label: 'Let me pick', pick: 'multi', preset: farm().filter(x => x !== 'Organik') },
          ] : [
            { label: `Yes, all ${farm().length} plots`, value: ALL_PLOTS, rec: true, re: /yes|ja|all|every|evet/i },
            { label: 'Let me pick', pick: 'multi', preset: farm() },
          ],
          ack: () => { const ps = rowPlots(rowsOf(hasTok('tümalan'))[0]); return `${n} sprays × ${ps.length} plots = ${n * ps.length} treatments.`; },
        };
      },
      decis: () => ({
        html: `<p>Two rows only say <code>decis</code>. There are two Decis products: <b>Decis 25 EC</b> and <b>Decis 100 EC</b>.</p>
          <p class="muted">The dose of 25 ml/100 l is on the Decis 25 EC label; for 100 EC it would be ~4× too high.</p>`,
        snip: snip('xlsx', [xRow(8), xRow(10)], 'rows 8 and 10', ['trade', 'ai', 'dose'], [8, 10]),
        options: [
          { label: 'Decis 25 EC', value: 'Decis 25 EC', rec: true, re: /25/ },
          { label: 'Decis 100 EC', value: 'Decis 100 EC', re: /100/ },
        ],
        ack: (v) => `Both rows → ${v} (deltamethrin).`,
      }),
      delegate: () => ({
        html: `<p>4 Excel rows say <code>delegate</code> with active substance “spinetorom %25 wp”. The registered product is <b>Delegate 250 WG</b> — same substance and strength, but WG, not WP.</p><p>Use Delegate 250 WG?</p>`,
        snip: snip('xlsx', [xRow(13)], 'row 13', ['trade', 'ai'], [13]),
        options: [
          { label: 'Yes, Delegate 250 WG', value: 'ok', rec: true, re: /yes|ja|ok|250|wg|evet/i, ack: () => 'Delegate 250 WG (spinetoram).' },
          { label: 'Leave those rows out', value: SKIP_V, re: /skip|leave|no|nein|out/i, ack: () => 'The 4 Delegate rows are left out.' },
        ],
      }),
      water: () => ({
        html: `<p>The column <code>Toplam Kullanılan Su Miktarı</code> (total water used) has values 25, 35, 60 and 30, but no unit. I need it to work out the rate per hectare.</p>
          <p class="muted">For a tank sprayer on ~10 ha, 25–60 <b>tonnes</b> fits (≈ 1 000–1 500 l/ha).</p>`,
        snip: snip('xlsx', [xRow(1)], 'row 1', ['water'], [1]),
        options: [
          { label: 'Tonnes per row', value: 't', rec: true, re: /ton|\bt\b/i, ack: () => 'Water in tonnes — 25 t over the row\'s plots.' },
          { label: 'Litres per row', value: 'l', prio: 1, re: /lit|liter|\bl\b/i, ack: () => 'Water in litres per row.' },
          { label: 'Litres per dekar', value: 'lda', prio: 2, re: /dekar|da\b|per/i, ack: () => 'Water in litres per dekar.' },
        ],
      }),
      year: () => ({
        html: `<p>Excel row 9 is dated <code>4/25/25</code>; all other rows are from 2026, and row 8 is <code>4/25/26</code>. Probably a typo?</p>`,
        snip: snip('xlsx', [[xRow(8)[0], xRow(9)[1]]], 'rows 8–9', ['date'], [9]),
        options: [
          { label: 'Yes, make it 25 Apr 2026', value: 'fix', rec: true, re: /yes|ja|fix|2026|typo|evet/i, ack: () => 'Row 9 → 25 Apr 2026.' },
          { label: 'Keep 2025', value: 'keep', re: /keep|2025|no|nein/i, ack: () => 'Row 9 stays in 2025 (previous season).' },
        ],
      }),
      harvest: () => ({
        html: `<p>One check came up: scan row 1 sprayed Hektaş Göztaşı on <b>10 Mar</b> with a 21-day PHI, but the harvest date says <b>22 Mar</b> — 9 days early. All other rows have harvest ≥ spray + PHI.</p>`,
        snip: snip('scan', [sRow(1)], 'row 1', ['date', 'phi', 'harvest'], [1]),
        options: [
          { label: 'Import and flag it', value: 'flag', rec: true, re: /flag|yes|ja|import|mark/i, ack: () => 'B1 will get a PHI warning on that spray.' },
          { label: 'Import as written', value: 'plain', prio: 1, re: /written|plain|no|nein|ignore/i, ack: () => 'No warning — imported as written.' },
        ],
      }),
    };
    const ORDER = ['columns', 'bca', 'kanal', 'organik', 'kalan', 'tum', 'decis', 'delegate', 'water', 'year', 'harvest'];
    const skipQ = (id) => id === 'harvest' && A.columns === 'ignore';
    const openQuestions = () => ORDER.filter(id => A[id] === undefined && !skipQ(id)).length;

    // ── Chat state ────────────────────────────────────────────────────────
    let S;
    function reset() {
      A = {};
      S = { msgs: [], cur: null, pick: null, typing: false, stage: 'empty', queue: [] };
      // Empty state: the accepted file types as icons inside the drop zone — no prose.
      const ftile = (ext, label, icon) => `<div class="ftype"><div class="fdoc">${icon}<span class="fext">${ext}</span></div><div class="flbl">${label}</div></div>`;
      const DOC = '<svg viewBox="0 0 48 60"><path d="M4 0h28l16 16v40a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V4a4 4 0 0 1 4-4z" fill="#fff" stroke="#c9c9cf" stroke-width="2"/><path d="M32 0v12a4 4 0 0 0 4 4h12" fill="#ededf0" stroke="#c9c9cf" stroke-width="2"/></svg>';
      const CAM = '<svg viewBox="0 0 48 60"><rect x="1" y="1" width="46" height="58" rx="5" fill="#fff" stroke="#c9c9cf" stroke-width="2"/><path d="M8 44l10-13 8 9 6-7 9 11z" fill="#d6d6db"/><circle cx="33" cy="18" r="5" fill="#d6d6db"/></svg>';
      bot(`<div class="drop" data-act="load">
          <div class="ftypes">${ftile('XLSX', 'Excel', DOC)}${ftile('CSV', 'CSV', DOC)}${ftile('PDF', 'PDF scan', DOC)}${ftile('JPG', 'Photo of a notebook', CAM)}</div>
          <div class="dhint">${FILE_ICO.replace('<svg', '<svg style="width:18px;height:18px;fill:currentColor;vertical-align:-4px;margin-right:6px"')}Drop files or click to upload · any layout, any language</div>
        </div>
        <div class="chips" style="margin-top:20px"><button class="chip" data-act="load">Try the example: İlaçlama defteri 2026.xlsx + scan.pdf</button></div>`);
      render();
    }
    const bot = (html, extra = {}) => S.msgs.push({ who: 'bot', html, ...extra });
    const me = (html, extra = {}) => S.msgs.push({ who: 'me', html, ...extra });
    const later = (fn, ms = 650) => { S.typing = true; render(); setTimeout(() => { S.typing = false; fn(); render(); }, ms); };

    function loadExample() {
      if (S.stage !== 'empty') return;
      S.stage = 'reading';
      const tile = (img, name, sz) => `<div class="file"><div class="thumb" style="background-image:url(${img})"></div><div><div class="nm">${esc(name)}</div><div class="sz">${sz}</div></div></div>`;
      me(`<div class="files-msg">${tile(SOURCES.xlsx.img, SOURCES.xlsx.file, 'Excel · 24 KB')}${tile(SOURCES.scan.img, SOURCES.scan.file, 'PDF · 1 page · 1.2 MB')}</div>`);
      later(() => {
        const nx = rowsOf(r => r.src === 'xlsx').length, ns = rowsOf(r => r.src === 'scan').length;
        const exact = new Set(DIARY_ROWS.flatMap(r => parseParcels(r.parcels).tokens).filter(t => PLOT_NAMES.includes(t)));
        const prods = new Set(DIARY_ROWS.map(r => (byKey(PRODUCT_ALIASES)[nk(productKey(r))] || [])).filter(x => x[1] === 'auto').map(x => x[0]));
        S.stage = 'asking';
        bot(`<p class="ack">✓ Read ${nx + ns} rows and matched most of it on my own.</p>
          <details class="more"><summary>Show what I matched</summary>
            <table class="kv"><tr><th>In your files</th><th></th><th>Matched to</th></tr>
            ${[...DIARY_ROWS.reduce((m, r) => { const k = productKey(r), a = byKey(PRODUCT_ALIASES)[nk(k)]; if (a && a[1] === 'auto') { const e = m.get(a[0]) || new Set(); e.add(k); m.set(a[0], e); } return m; }, new Map())]
              .map(([p, ks]) => `<tr><td>${[...ks].map(esc).join(', ')}</td><td class="arrow">→</td><td>${esc(p)}<div class="soft">${esc(DIARY_PRODUCTS[p])}</div></td></tr>`).join('')}
            <tr><td>${[...exact].sort((a, b) => a.localeCompare(b, 'en', { numeric: true })).join(', ')}</td><td class="arrow">→</td><td>Same plot codes as in ResiYou</td></tr>
            <tr><td>püskürtme</td><td class="arrow">→</td><td>Foliar spray</td></tr>
            <tr><td>gr, cc</td><td class="arrow">→</td><td>g, ml</td></tr></table>
          </details>
          <p style="margin-top:8px"><b>${openQuestions()} questions</b> about the rest.</p>`);
        S.queue = [...ORDER];
        next();
      }, 1100);
    }

    function next() {
      const id = S.queue.find(q => A[q] === undefined && !skipQ(q));
      S.queue = S.queue.filter(q => q !== id);
      if (!id) return finish();
      ask(id);
    }
    function ask(id, lead = '') {
      const q = QUESTIONS[id]();
      S.cur = { id, q };
      bot(`${lead}${q.html}${q.snip}`, { qid: id });
    }
    function finish(lead = '') {
      S.cur = null;
      if (S.stage === 'done') return;
      S.stage = 'review';
      const per = {};
      DIARY_ROWS.forEach(r => { if (rowTreatments(r)) rowPlots(r).forEach(p => per[p] = (per[p] || 0) + 1); });
      const plots = Object.keys(per).sort((a, b) => a.localeCompare(b, 'en', { numeric: true }));
      const skipped = DIARY_ROWS.filter(r => rowProduct(r) === SKIP_V).length;
      bot(`${lead}<p>That's everything. Here's what I'll import:</p>
        <table class="kv"><tr><th>Plots</th><th>Treatments each</th></tr>
        ${[...new Set(plots.map(p => per[p]))].sort((x, y) => y - x).map(n => { const ps = plots.filter(p => per[p] === n);
          return `<tr><td>${ps.map(p => esc(p) + (newPlots().includes(p) ? '<span class="tag new">New draft plot</span>' : '')).join(', ')}</td><td>${n}</td></tr>`; }).join('')}
        <tr><td><b>${plots.length} plots</b></td><td><b>${totalTreatments()} in total</b></td></tr></table>
        ${skipped ? `<p class="muted">${skipped} rows left out, as you said.</p>` : ''}
        <p class="muted">I'll remember these answers for your next diary. Want to change anything? Just tell me, or tap <i>Change</i> under an answer.</p>
        <button class="primary" data-act="import">Import ${totalTreatments()} treatments</button>`, { final: true });
    }

    function answer(opt, text) {
      const { id, q } = S.cur;
      A[id] = opt.value;
      me(esc(text || opt.label), { qid: id });
      S.cur = null; S.pick = null;
      const ack = (opt.ack || q.ack)?.(Array.isArray(opt.value) ? plotsLabel(opt.value) : opt.value);
      later(() => {
        const lead = ack ? `<p class="ack">✓ ${esc(ack)}</p>` : '';
        const nextId = S.queue.find(x => A[x] === undefined && !skipQ(x));
        if (nextId) { S.queue = S.queue.filter(x => x !== nextId); ask(nextId, lead); }
        else finish(lead);
      });
    }

    // Free text: an option's keywords, or plot codes for a picker question.
    function answerText(text) {
      me(esc(text));
      if (S.stage === 'empty') { S.msgs.pop(); return loadExample(); }
      if (!S.cur) {
        // After the review: understand "change <thing>" requests.
        const hit = ORDER.find(id => new RegExp({ bca: 'b ?c/?a|scan', kanal: 'kanal', organik: 'organi', kalan: 'kalan|rest', tum: 'tüm|tum|whole', decis: 'decis', delegate: 'delegate', water: 'water|su\\b|wasser', year: 'year|2025|jahr', harvest: 'harvest|phi', columns: 'column' }[id], 'i').test(text));
        return later(() => hit ? (S.stage = 'asking', delete A[hit], ask(hit, '<p>Sure — let\'s redo that one.</p>')) : bot('<p>Tell me what to change — e.g. “Kanal altı is A3” or “tüm alan without Organik”.</p>'));
      }
      const { q } = S.cur;
      const codes = plotCodes(text);
      const picker = q.options.find(o => o.pick);
      const ord = [...q.options].sort((a, b) => (b.prio || 0) - (a.prio || 0)); // most specific keywords first
      const opt = ord.find(o => o.re && o.re.test(text));
      S.msgs.pop();
      if (codes.length && picker && !(opt && opt.value === 'B1' && codes.join() === 'B1')) {
        const value = picker.pick === 'single' ? codes[0] : codes;
        return answer({ value }, text);
      }
      if (opt) return answer(opt, text);
      me(esc(text));
      later(() => bot(`<p>Sorry, I didn't get that. Pick one of these${picker ? ', or name plots like “A3” or “B2-B6”' : ''}:</p>`));
    }

    // "A3, B2-B6" → A3 B2 B3 B4 B5 B6 (only codes that exist).
    function plotCodes(text) {
      const out = [];
      const rest = text.toUpperCase().replace(/\b([AB])(\d{1,2})\s*[-–]\s*\1?(\d{1,2})\b/g, (m, l, a, b) => { for (let i = +a; i <= +b; i++) out.push(l + i); return ' '; });
      (rest.match(/\b[AB]\d{1,2}\b/g) || []).forEach(c => out.push(c));
      return [...new Set(out)].filter(c => PLOT_NAMES.includes(c));
    }
    function startPick(opt) {
      S.pick = { mode: opt.pick, sel: new Set(opt.preset || []) };
      render();
    }

    // ── Render ────────────────────────────────────────────────────────────
    const thread = document.getElementById('thread');
    function render() {
      const lastBotQ = [...S.msgs].reverse().find(m => m.who === 'bot');
      thread.innerHTML = S.msgs.map((m, i) => {
        let tail = '';
        if (S.cur && m === lastBotQ) { // options sit on the latest bot message, so they survive a “didn't get that”
          if (S.pick) {
            const list = S.pick.mode === 'single' ? PLOT_NAMES : farm();
            tail = `<div class="pick">${list.map(n => `<button class="pchip${S.pick.sel.has(n) ? ' on' : ''}" data-p="${esc(n)}">${esc(n)}</button>`).join('')}
              ${S.pick.mode === 'multi' ? `<button class="chip done" data-act="pickdone">Use ${S.pick.sel.size} plots</button>` : ''}</div>`;
          } else {
            tail = `<div class="chips">${S.cur.q.options.map((o, j) => `<button class="chip" data-opt="${j}">${esc(o.label)}${o.rec ? '<span class="rec">· suggested</span>' : ''}</button>`).join('')}</div>`;
          }
        }
        const change = m.who === 'me' && m.qid && S.stage !== 'done' ? `<button class="change" data-change="${m.qid}">Change</button>` : '';
        return `<div class="msg ${m.who}"><div class="av">${m.who === 'bot' ? BOT_ICO : 'T'}</div><div><div class="bubble">${m.html}${tail}</div>${change}</div></div>`;
      }).join('') + (S.typing ? `<div class="msg bot"><div class="av">${BOT_ICO}</div><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>` : '');
      thread.querySelectorAll('.snip[data-focus]').forEach(el => { const f = +el.dataset.focus; if (f + 140 > el.clientWidth) el.scrollLeft = f - 40; });
      // Show the start of a long bot message rather than its end.
      const last = thread.lastElementChild;
      thread.scrollTop = last && last.classList.contains('bot') && last.offsetHeight > thread.clientHeight - 40 ? last.offsetTop - thread.offsetTop - 8 : thread.scrollHeight;

      const strip = document.getElementById('strip');
      strip.hidden = S.stage === 'empty' || S.stage === 'reading';
      if (!strip.hidden) {
        const left = openQuestions();
        strip.innerHTML = `<span class="files">${FILE_ICO}${esc(SOURCES.xlsx.file)} + ${esc(SOURCES.scan.file)}</span>
          <span class="stat"><b>${totalTreatments()}</b> treatments on <b>${plotsTouched()}</b> plots${newPlots().length ? ` · <b>${newPlots().length}</b> new` : ''}</span>
          <span class="left${left ? '' : ' ok'}">${S.stage === 'done' ? '✓ Imported' : left ? `${left} question${left > 1 ? 's' : ''} left` : '✓ Ready to import'}</span>`;
      }
    }

    thread.addEventListener('click', (e) => {
      const t = e.target.closest('button, [data-act]');
      if (!t) return;
      if (t.dataset.act === 'load') return loadExample();
      if (t.dataset.act === 'import') {
        if (S.stage !== 'review') return;
        S.stage = 'done';
        me('Import');
        const n = totalTreatments(), p = plotsTouched(), np = newPlots();
        return later(() => bot(`<p><span class="ack">✓ Imported ${n} treatments on ${p} plots.</span>${np.length ? ` Created ${np.length} draft plot${np.length > 1 ? 's' : ''} (${np.map(esc).join(', ')}) — add crop and area when you get a chance.` : ''}</p>
          <p><a href="index.html">Open Plots</a> · <a href="#" data-act="again">Import another diary</a></p>`), 900);
      }
      if (t.dataset.act === 'again') { e.preventDefault(); return reset(); }
      if (t.dataset.opt !== undefined && S.cur) {
        const o = S.cur.q.options[+t.dataset.opt];
        return o.pick ? startPick(o) : answer(o);
      }
      if (t.dataset.p && S.pick) {
        if (S.pick.mode === 'single') return answer({ value: t.dataset.p }, t.dataset.p);
        S.pick.sel.has(t.dataset.p) ? S.pick.sel.delete(t.dataset.p) : S.pick.sel.add(t.dataset.p);
        return render();
      }
      if (t.dataset.act === 'pickdone' && S.pick) { const v = [...S.pick.sel]; return answer({ value: v }, plotsLabel(v)); }
      if (t.dataset.change) {
        const id = t.dataset.change;
        if (S.cur) S.queue.unshift(S.cur.id);
        S.pick = null; S.stage = 'asking';
        delete A[id];
        return later(() => ask(id, '<p>Sure — let\'s redo that one.</p>'), 400);
      }
    });

    const form = document.getElementById('composer'), ta = document.getElementById('text');
    form.addEventListener('submit', (e) => { e.preventDefault(); const v = ta.value.trim(); if (!v || S.typing) return; ta.value = ''; answerText(v); });
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    document.getElementById('attach').addEventListener('click', loadExample);
    reset();
  </script>
  <script src="app.js"></script>
</body>
</html>
